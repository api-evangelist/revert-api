alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: Revert
serviceCategory: Integration and iPaaS
billingModel:
  pricingCategory: Usage-Based
  billingFrequency: Monthly
  billingCurrency: USD
  chargeCategories:
  - Usage
  - Purchase
  - Adjustment
focusColumns:
  ServiceName: Revert Cloud
  ServiceCategory: Integration and iPaaS
  ProviderName: Revert
  PublisherName: Revert
  InvoiceIssuerName: Revert
  BillingCurrency: USD
  ChargeCategory: Usage
  PricingCategory: Usage-Based
meters:
- name: linked_connections
  description: Number of linked third-party connections / integrated customer accounts, the historical Revert Cloud billing unit.
  unit: connections
  aggregation: max
  dimensions:
  - account
  - environment
  - provider
- name: unified_api_requests
  description: Unified API and proxy requests processed; not separately billed but a driver of downstream provider cost.
  unit: requests
  aggregation: sum
  dimensions:
  - account
  - connection
  - module
- name: self_hosted_compute
  description: Infrastructure cost of running the self-hosted Revert backend, Postgres, and Redis (no Revert invoice).
  unit: hours
  aggregation: sum
  dimensions:
  - deployment
principles:
- name: Visibility
  description: Track linked connections per environment and provider; on self-hosted, monitor backend/Postgres/Redis costs and downstream provider API spend.
- name: Allocation
  description: Map connections and environments to workloads/teams so integration cost maps to internal cost centers.
- name: Optimization
  description: Prefer self-hosting to avoid per-connection vendor fees when volume is high; use unified models and the proxy to consolidate calls; prune unused connections.
- name: Accountability
  description: Assign owners per environment/provider; review connection counts and downstream provider spend monthly.
