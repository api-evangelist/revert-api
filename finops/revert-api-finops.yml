description: >-
  FinOps view of Revert spend. Revert's platform is open source (AGPL-3.0) and free
  to self-host - in that model the cost is your own compute, database (Postgres),
  and Redis for running the Revert backend and connect UI, with no vendor invoice.
  Revert Cloud was the managed offering, historically billed on the number of
  linked connections / integrated customer accounts above a free developer tier.
  IMPORTANT - the hosted Cloud service has been retired (Revert joined Ampersand;
  revert.dev no longer resolves as of 2026-07-12), so the managed-billing view below
  is historical/modeled; the live cost model today is self-hosted infrastructure.
notes: >-
  Cloud per-connection rates are not reconciled and the hosted billing surface no
  longer exists. For self-hosted deployments, the dominant costs are infrastructure
  (Node backend + Postgres + Redis) plus any paid downstream provider APIs. Teams
  wanting a managed commercial option are directed to Ampersand.
sources:
- https://github.com/revertinc/revert
- https://www.revert.dev/
