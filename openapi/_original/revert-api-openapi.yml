openapi: 3.0.3
info:
  title: Revert Unified API
  description: >-
    Revert is an open-source unified API for building product integrations. A
    single set of REST endpoints normalizes third-party CRMs, chat/messaging,
    ticketing, accounting, and ATS providers into unified data models, while Revert
    manages OAuth connections, token refresh, retries, and a passthrough proxy for
    provider-native calls.


    Authentication uses an `x-revert-api-token` header (your Revert API key) plus an
    `x-revert-t-id` tenant header identifying the linked customer connection, and an
    optional `x-api-version` header.


    STATUS - The hosted Revert Cloud service (https://api.revert.dev) has been
    retired; Revert has joined Ampersand and revert.dev no longer resolves as of
    2026-07-12. This specification is preserved from the open-source, self-hostable
    backend (github.com/revertinc/revert). Paths, methods, headers, and unified
    fields were read from the repository's Fern API definition (fern/definition/)
    and Express route registration; response payload schemas are modeled from the
    unified type definitions and are simplified where noted.
  version: '1.0'
  contact:
    name: Revert
    url: https://github.com/revertinc/revert
  license:
    name: AGPL-3.0
    url: https://github.com/revertinc/revert/blob/main/LICENSE
servers:
  - url: https://api.revert.dev
    description: Revert Cloud (hosted) - RETIRED, DNS no longer resolves as of 2026-07-12.
  - url: http://localhost:4001
    description: Self-hosted (default SERVER_PORT=4001).
security:
  - revertApiToken: []
    revertTenantId: []
tags:
  - name: CRM
    description: Unified CRM models - contacts, leads, companies, deals, notes, events, tasks, users.
  - name: Chat
    description: Unified messaging models - channels, users, messages.
  - name: Ticketing
    description: Unified ticketing models - tasks, users, comments, collections.
  - name: Proxy
    description: Passthrough proxy to the underlying provider's native API.
  - name: Connection Management
    description: Manage linked third-party connections and connection webhooks per tenant.
  - name: Metadata
    description: Environment / app configuration for the connect UI.
paths:
  /crm/ping:
    get:
      operationId: pingCrm
      tags: [CRM]
      summary: Health check (CRM)
      description: Simple authenticated ping to verify credentials and connectivity.
      responses:
        '200': { $ref: '#/components/responses/Ping' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /crm/contacts:
    get:
      operationId: getContacts
      tags: [CRM]
      summary: List contacts
      parameters:
        - $ref: '#/components/parameters/Fields'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200': { $ref: '#/components/responses/ContactList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: createContact
      tags: [CRM]
      summary: Create a contact
      requestBody: { $ref: '#/components/requestBodies/ContactWrite' }
      responses:
        '200': { $ref: '#/components/responses/CreateOrUpdate' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /crm/contacts/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: getContact
      tags: [CRM]
      summary: Get a contact
      responses:
        '200': { $ref: '#/components/responses/ContactSingle' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateContact
      tags: [CRM]
      summary: Update a contact
      requestBody: { $ref: '#/components/requestBodies/ContactWrite' }
      responses:
        '200': { $ref: '#/components/responses/CreateOrUpdate' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /crm/contacts/search:
    post:
      operationId: searchContacts
      tags: [CRM]
      summary: Search contacts
      requestBody: { $ref: '#/components/requestBodies/Search' }
      responses:
        '200': { $ref: '#/components/responses/ContactList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /crm/leads:
    get:
      operationId: getLeads
      tags: [CRM]
      summary: List leads
      responses:
        '200': { $ref: '#/components/responses/EntityList' }
