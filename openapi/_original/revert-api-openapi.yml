        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: createTicketComment
      tags: [Ticketing]
      summary: Create a ticket comment
      responses:
        '200': { $ref: '#/components/responses/CreateOrUpdate' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /ticket/comments/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: getTicketComment
      tags: [Ticketing]
      summary: Get a ticket comment
      responses:
        '200': { $ref: '#/components/responses/EntitySingle' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateTicketComment
      tags: [Ticketing]
      summary: Update a ticket comment
      responses:
        '200': { $ref: '#/components/responses/CreateOrUpdate' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /ticket/collections:
    get:
      operationId: getTicketCollections
      tags: [Ticketing]
      summary: List ticket collections
      description: Collections (projects/boards) available in the linked ticketing provider.
      responses:
        '200': { $ref: '#/components/responses/EntityList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /ticket/proxy:
    post:
      operationId: ticketProxy
      tags: [Proxy]
      summary: Ticketing passthrough proxy
      requestBody: { $ref: '#/components/requestBodies/Proxy' }
      responses:
        '200': { $ref: '#/components/responses/Proxy' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /connection:
    get:
      operationId: getConnection
      tags: [Connection Management]
      summary: Get a connection
      description: Get details of the linked connection for the tenant identified by x-revert-t-id.
      responses:
        '200': { $ref: '#/components/responses/Connection' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteConnection
      tags: [Connection Management]
      summary: Delete a connection
      description: Delete the linked connection for the tenant identified by x-revert-t-id.
      responses:
        '200': { $ref: '#/components/responses/Deleted' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /connection/all:
    get:
      operationId: getAllConnections
      tags: [Connection Management]
      summary: List all connections
      description: Get all connections for the account associated with the API token.
      responses:
        '200': { $ref: '#/components/responses/ConnectionList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /connection/webhook:
    get:
      operationId: getConnectionWebhook
      tags: [Connection Management]
      summary: Get a connection webhook
      responses:
        '200': { $ref: '#/components/responses/Envelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: createConnectionWebhook
      tags: [Connection Management]
      summary: Create a connection webhook
      description: Register a webhook URL that receives connection events for the tenant.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [webhookUrl]
              properties:
                webhookUrl: { type: string, format: uri }
      responses:
        '200': { $ref: '#/components/responses/Envelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      operationId: deleteConnectionWebhook
      tags: [Connection Management]
      summary: Delete a connection webhook
      responses:
        '200': { $ref: '#/components/responses/Deleted' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /connection/import:
    post:
      operationId: importConnections
      tags: [Connection Management]
      summary: Bulk import connections
      description: One-time bulk import of existing connections for an environment.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                connections:
                  type: array
                  items:
                    type: object
                    additionalProperties: true
      responses:
        '200': { $ref: '#/components/responses/Envelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /connection/integration-status/{revertPublicToken}:
    get:
      operationId: getConnectionIntegrationStatus
      tags: [Connection Management]
      summary: OAuth connect status (Server-Sent Events)
      description: >-
        Streams the OAuth connect event status for a tenant as HTTP Server-Sent
        Events (text/event-stream). This is one-way HTTP streaming, not WebSocket.
      security: []
      parameters:
        - name: revertPublicToken
          in: path
          required: true
          schema: { type: string }
        - name: tenantId
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: An SSE stream of connect status messages.
          content:
            text/event-stream:
              schema: { type: string }
  /metadata/crms:
    get:
      operationId: getMetadataCrms
      tags: [Metadata]
      summary: Get environment integrations config
      description: Retrieve the list of integrations available for the environment identified by its public token.
      security: []
      parameters:
        - name: revertPublicToken
          in: query
          required: true
          schema: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Envelope' }
components:
  securitySchemes:
    revertApiToken:
      type: apiKey
      in: header
      name: x-revert-api-token
      description: Your Revert API key (private token) for the environment.
    revertTenantId:
      type: apiKey
      in: header
      name: x-revert-t-id
      description: The tenant / customer id of the linked connection.
  parameters:
    Id:
      name: id
      in: path
      required: true
      description: The unified Revert id (or downstream remote id) of the object.
      schema: { type: string }
    Fields:
      name: fields
      in: query
      required: false
      description: Optional comma-separated list of additional non-unified fields to include.
      schema: { type: string }
    PageSize:
      name: pageSize
      in: query
      required: false
      schema: { type: integer }
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque pagination cursor.
      schema: { type: string }
  requestBodies:
    ContactWrite:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ContactWrite' }
    Search:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              searchCriteria:
                type: object
                additionalProperties: true
    Proxy:
      required: true
      content:
        application/json:
          schema:
            type: object
            description: The provider-native request to forward (path, method, and body vary by provider).
            properties:
              path: { type: string }
              method: { type: string }
              body:
                type: object
                additionalProperties: true
            additionalProperties: true
  responses:
    Ping:
      description: Pong.
      content:
        application/json:
          schema:
            type: object
            properties:
              status: { type: string }
              message: { type: string }
    Unauthorized:
      description: Missing or invalid x-revert-api-token / x-revert-t-id.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: The requested resource was not found.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Deleted:
      description: Deletion result.
      content:
        application/json:
          schema:
            type: object
            properties:
              status: { type: string }
              deleted: { type: boolean }
    Envelope:
      description: Standard status-wrapped response.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
    CreateOrUpdate:
      description: Create/update result.
      content:
        application/json:
          schema:
            type: object
            properties:
              status: { type: string }
              message: { type: string }
              result: {}
    ContactSingle:
      description: A single contact.
      content:
        application/json:
          schema:
            type: object
            properties:
              status: { type: string }
              result: { $ref: '#/components/schemas/Contact' }
    ContactList:
      description: A list of contacts.
      content:
        application/json:
          schema:
            type: object
            properties:
              status: { type: string }
              next: { type: string, nullable: true }
              previous: { type: string, nullable: true }
              results:
                type: array
                items: { $ref: '#/components/schemas/Contact' }
    EntitySingle:
      description: A single unified object.
      content:
        application/json:
          schema:
            type: object
            properties:
              status: { type: string }
              result:
                type: object
                additionalProperties: true
    EntityList:
      description: A list of unified objects.
      content:
        application/json:
          schema:
            type: object
            properties:
              status: { type: string }
              next: { type: string, nullable: true }
              previous: { type: string, nullable: true }
              results:
                type: array
                items:
                  type: object
                  additionalProperties: true
    Connection:
      description: A single connection.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Connection' }
    ConnectionList:
      description: All connections for the account.
      content:
        application/json:
          schema:
            type: array
            items: { $ref: '#/components/schemas/Connection' }
    Proxy:
      description: The raw response from the downstream provider.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
  schemas:
    Error:
      type: object
      properties:
        status: { type: string }
        error: { type: string }
        errorMessage: {}
    Envelope:
      type: object
      properties:
        status: { type: string }
        error: { type: string, nullable: true }
      additionalProperties: true
    CommonUnifiedFields:
      type: object
      properties:
        id:
          type: string
          description: The unique id of this object in Revert.
        remoteId:
          type: string
          description: The unique id of this object in the downstream provider.
        createdTimestamp: {}
        updatedTimestamp: {}
        additional:
          type: object
          description: Non-unified / provider-specific fields.
          additionalProperties: true
    ContactWrite:
      type: object
      description: Modeled from Revert's unified contact fields.
      properties:
        firstName: { type: string }
        lastName: { type: string }
        phone: { type: string }
        email: { type: string }
        additional:
          type: object
          additionalProperties: true
    Contact:
      allOf:
        - $ref: '#/components/schemas/CommonUnifiedFields'
        - $ref: '#/components/schemas/ContactWrite'
    Connection:
      type: object
      description: A linked third-party connection. Modeled from the unified Connection type.
      properties:
        tenantId: { type: string }
        tpId:
          type: string
          description: The third-party provider id (e.g. hubspot, salesforce, slack, jira).
        tpCustomerId: { type: string }
        appId: { type: string }
        status: { type: string }
        createdAt: { type: string }
      additionalProperties: true
