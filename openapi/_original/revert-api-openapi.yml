  /chat/message:
    post:
      operationId: sendChatMessage
      tags: [Chat]
      summary: Send a message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text: { type: string }
                channelId: { type: string }
      responses:
        '200': { $ref: '#/components/responses/CreateOrUpdate' }
        '401': { $ref: '#/components/responses/Unauthorized' }
