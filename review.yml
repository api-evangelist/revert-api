actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    No WebSocket protocol surface exists. Revert's own public API is
    request/response REST plus HTTP Server-Sent Events for OAuth connect status
    and Svix webhooks for connection events. No AsyncAPI document was created
    because SSE is one-way HTTP streaming (not WebSocket) and the primary surface
    is REST. The WebSocket precision answer is false. The entry also records that
    the hosted service is retired (Revert joined Ampersand; revert.dev DNS no
    longer resolves) while the AGPL-3.0 self-hostable repository remains the
    grounded source for all documented endpoints.
