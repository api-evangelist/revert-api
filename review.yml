aid: revert-api
name: Revert
review:
  question: Does Revert expose a documented public WebSocket API?
  answer: false
  date: '2026-07-12'
  reviewer: API Evangelist
  asyncapiSpecCreated: false
  asyncapiScopeNote: |
    No AsyncAPI document was authored. Revert's public HTTP surface (unified CRM,
    chat, ticketing, accounting, ATS models plus connection management and a
    passthrough proxy) is request/response REST over HTTPS. The only server-push
    transport is HTTP Server-Sent Events (SSE) on the OAuth connect-status
    endpoints (/connection/integration-status/{revertPublicToken}, and the
    per-module /chat/integration-status and /ticket/integration-status), delivered
    via the better-sse library. SSE is a one-way HTTP streaming transport and is
    not WebSocket. There is no ws:// or wss:// endpoint anywhere in the API.
findings:
  summary: |
    Revert does not publish a documented public WebSocket API. Revert is an
    open-source unified API for product integrations. Its API is REST over HTTPS:
    a hosted base of https://api.revert.dev (Revert Cloud) or a self-hosted
    deployment (default http://localhost:4001, SERVER_PORT=4001). Requests are
    authenticated with an x-revert-api-token header plus an x-revert-t-id tenant
    header (and an optional x-api-version). Real-time OAuth connect status is
    delivered via HTTP Server-Sent Events (better-sse), not WebSocket. Connections
    also emit webhooks (Svix) to consumer-registered URLs. No realtime,
    bidirectional WebSocket (ws:// or wss://) endpoint is documented in the API or
    the open-source backend as of the review date.
  serviceStatus: |
    IMPORTANT - The hosted Revert service has been retired. Revert has joined
    Ampersand (per the banner on github.com/revertinc/revert, which directs new
    users to docs.withampersand.com). As of 2026-07-12, revert.dev, www.revert.dev,
    api.revert.dev, and docs.revert.dev return no DNS A records (apex has only an
    SOA at Namecheap default nameservers registrar-servers.com; subdomains are
    NXDOMAIN), so the hosted REST API and hosted docs are offline. The catalog
    entry therefore documents the API from the open-source repository, which
    remains available and self-hostable.
  openSource: |
    The Revert platform is open source under AGPL-3.0 (github.com/revertinc/revert,
    last release v1.7.1, 2024-05-13) and self-hostable via Docker Compose. The
    backend (packages/backend) exposes the same REST API described here; the unified
    models, routes, and headers were read directly from the Fern API definition in
    fern/definition/ and the Express route registration in
    packages/backend/routes/index.ts.
  transports:
    - protocol: REST
      scheme: https
      baseURL: https://api.revert.dev
      documented: true
      note: Hosted Revert Cloud base (now offline). Self-hosted default is http://localhost:4001.
    - protocol: SSE
      scheme: https
      documented: true
      note: Server-Sent Events (better-sse) on connection/integration-status endpoints for OAuth connect status. One-way HTTP streaming, not WebSocket.
    - protocol: Webhook
      scheme: https
      documented: true
      note: Connection events delivered to consumer-registered webhook URLs via Svix. Server-to-endpoint HTTP, not WebSocket.
    - protocol: WebSocket
      scheme: wss
      documented: false
      note: No WebSocket endpoint is documented anywhere in Revert's API, Fern definition, or backend routes as of the review date.
